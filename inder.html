<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; media-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>CI 拉霸抽獎｜測試版 6.0</title>
<style>
:root{color-scheme:dark;--bg:#0b0f1e;--panel:#151c33;--text:#eef4ff;--muted:#b5c4da;--accent:#69e4d1;--gold:#f6c64f;--gold2:#a86f12;--h:clamp(62px,8.2vw,100px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -10%,#3a1650,#0b0f1e 62%);color:var(--text);font:16px system-ui,"Microsoft JhengHei",sans-serif}
main{max-width:1260px;margin:auto;padding:24px}
h1{margin:0 0 6px}p{line-height:1.6}.muted{color:var(--muted)}
.notice{border-left:4px solid #ffce73;padding-left:12px}
.grid{display:grid;grid-template-columns:320px 1fr;gap:22px;align-items:start}
.panel{background:var(--panel);padding:22px;border-radius:18px;margin-top:20px}
label{display:block;margin:14px 0 7px}
input,textarea,button{font:inherit}
textarea,input{width:100%;padding:10px;background:var(--bg);color:var(--text);border:1px solid #64748b;border-radius:8px}
textarea{height:200px}input[type=checkbox]{width:auto}
button{padding:11px 17px;border-radius:9px;border:0;background:var(--accent);color:#08231f;font-weight:700;cursor:pointer;margin:7px 5px 0 0}
button.secondary{background:#d4dfef;color:#172238}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #ffce73;outline-offset:3px}
small{line-height:1.6;display:block}

#stage{position:relative;overflow:hidden}
#stage:fullscreen,#stage.pfs{--h:14.5vh;display:flex;flex-direction:column;justify-content:center;border-radius:0;margin:0;overflow:auto;background:radial-gradient(circle at 50% 0,#3a1650,#0b0f1e 70%)}
#stage.pfs{position:fixed;inset:0;z-index:999}
#stage:fullscreen .below,#stage.pfs .below{display:none}
#stage:fullscreen .machine,#stage.pfs .machine{width:min(96vw,1000px)}
body.pfs-on{overflow:hidden}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:6}
.stagehead{display:flex;justify-content:flex-end}
.tools button{margin:0 0 0 6px}
.rig{display:flex;align-items:center;justify-content:center;gap:14px;margin:18px 0 6px}

.machine{position:relative;width:min(100%,660px);padding:16px 22px 22px;border-radius:38px 38px 20px 20px;
 background:linear-gradient(160deg,#ec2b47,#a30c22 45%,#560411);border:6px solid var(--gold);
 box-shadow:0 0 0 3px var(--gold2),0 20px 44px rgba(0,0,0,.65),inset 0 5px 14px rgba(255,255,255,.28),inset 0 -12px 20px rgba(0,0,0,.45)}
.marquee{text-align:center;padding:10px 10px 8px;border-radius:24px;background:linear-gradient(#2b0a10,#140306);border:3px solid var(--gold2);margin-bottom:12px}
.title{font-size:clamp(22px,3.5vw,40px);font-weight:900;letter-spacing:.08em;margin:2px 0;
 background:linear-gradient(#fffbe0,#f6c64f 45%,#b77a12);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 9px rgba(246,198,79,.65))}
.bulbs{display:flex;justify-content:space-between;padding:0 4px}
.bulb{width:12px;height:12px;border-radius:50%;background:#5a4210;animation:chase 1.6s linear infinite}
@keyframes chase{0%,55%,100%{background:#5a4210;box-shadow:none}8%,40%{background:#fff3b0;box-shadow:0 0 10px 3px #ffd34d}}
.machine.spinning .bulb{animation-duration:.42s}
.machine.win .bulb{animation:blink .26s steps(1) infinite}
@keyframes blink{0%{background:#fff3b0;box-shadow:0 0 12px 4px #ffd34d}50%{background:#5a4210;box-shadow:none}}

.led{display:flex;justify-content:space-between;gap:12px;font:700 clamp(14px,1.7vw,20px)/1.3 ui-monospace,Consolas,monospace;color:#ffb347;
 background:#0a0503;border:2px solid #3a2208;border-radius:10px;padding:8px 14px;margin-bottom:12px;text-shadow:0 0 7px rgba(255,150,40,.85)}
.led span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.machine.spinning #ledR{animation:ledblink .5s steps(1) infinite}
@keyframes ledblink{50%{opacity:.25}}

.frame{position:relative;padding:8px;border-radius:18px;background:linear-gradient(#2a2a2a,#0e0e0e);box-shadow:inset 0 0 0 3px var(--gold2),0 6px 14px rgba(0,0,0,.6)}
.window{position:relative;height:calc(var(--h) * 3);border-radius:12px;overflow:hidden;
 background:linear-gradient(#8f8f8f,#f6f1e2 26%,#fffdf5 50%,#f6f1e2 74%,#8f8f8f)}
.strip{position:absolute;left:0;right:0;top:0;will-change:transform}
.sym{height:var(--h);display:flex;align-items:center;justify-content:center;padding:0 46px;border-bottom:2px solid rgba(0,0,0,.07);
 font-weight:900;font-size:calc(var(--h) * .44);color:#1c1c28;white-space:nowrap}
.sym span{overflow:hidden;text-overflow:ellipsis}
.sym.deco{color:#c8102e;letter-spacing:.3em}
.shade{position:absolute;inset:0;pointer-events:none;
 background:linear-gradient(rgba(0,0,0,.78),rgba(0,0,0,.12) 28%,transparent 40%,transparent 60%,rgba(0,0,0,.12) 72%,rgba(0,0,0,.78)),
 linear-gradient(90deg,rgba(0,0,0,.3),transparent 10%,transparent 90%,rgba(0,0,0,.3))}
.glass{position:absolute;inset:0;pointer-events:none;background:linear-gradient(172deg,rgba(255,255,255,.38),rgba(255,255,255,0) 36%)}
.payline{position:absolute;left:0;right:0;top:50%;height:var(--h);transform:translateY(-50%);pointer-events:none;
 border-top:3px solid rgba(214,22,56,.85);border-bottom:3px solid rgba(214,22,56,.85)}
.payline:before,.payline:after{content:'';position:absolute;top:50%;transform:translateY(-50%);border:15px solid transparent}
.payline:before{left:0;border-left-color:#e3243f}.payline:after{right:0;border-right-color:#e3243f}
.machine.win .payline{animation:pay .32s ease-in-out 8 alternate}
@keyframes pay{to{background:rgba(255,215,64,.38);box-shadow:0 0 26px 8px rgba(255,215,64,.75);border-color:#ffd740}}
.machine.thud .frame{animation:thud .28s ease-out}
@keyframes thud{30%{transform:translateY(4px)}100%{transform:none}}

.controls{display:flex;justify-content:center;margin-top:16px}
#start{margin:0;padding:16px 46px;border-radius:999px;font-size:clamp(20px,2.4vw,27px);font-weight:900;letter-spacing:.08em;color:#fff;
 background:radial-gradient(circle at 50% 30%,#ff6b7f,#d4102a 60%,#7a0012);border:4px solid var(--gold);
 box-shadow:0 7px 0 #5a000d,0 12px 22px rgba(0,0,0,.55);text-shadow:0 2px 2px rgba(0,0,0,.45)}
#start:not(:disabled):active{transform:translateY(5px);box-shadow:0 2px 0 #5a000d,0 5px 12px rgba(0,0,0,.5)}
#start:not(:disabled){animation:breathe 1.8s ease-in-out infinite}
@keyframes breathe{50%{box-shadow:0 7px 0 #5a000d,0 0 26px 6px rgba(255,90,110,.7)}}

.lever{--lh:calc(var(--h) * 3 + 70px);position:relative;flex:none;width:58px;height:var(--lh);margin:0;padding:0;background:none;border-radius:12px}
.lever .socket{position:absolute;left:50%;top:56%;width:42px;height:64px;transform:translate(-50%,-50%);border-radius:12px;
 background:linear-gradient(90deg,#5d5d5d,#e9e9e9 45%,#6a6a6a);box-shadow:0 5px 12px rgba(0,0,0,.6)}
.lever .rod{position:absolute;left:50%;top:14%;width:11px;height:42%;margin-left:-5.5px;border-radius:6px;transform-origin:50% 100%;
 background:linear-gradient(90deg,#8a8a8a,#fafafa 50%,#8a8a8a)}
.lever .knob{position:absolute;left:50%;top:14%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;
 background:radial-gradient(circle at 34% 30%,#ff9a9a,#d4102a 55%,#640010);box-shadow:0 7px 14px rgba(0,0,0,.6)}
.lever:not(:disabled):hover .knob{filter:brightness(1.15)}
.lever.pull .rod{animation:rod .75s cubic-bezier(.5,0,.3,1)}
.lever.pull .knob{animation:knob .75s cubic-bezier(.5,0,.3,1)}
@keyframes rod{0%,100%{transform:scaleY(1)}42%,55%{transform:scaleY(-.9)}}
@keyframes knob{0%,100%{transform:none}42%,55%{transform:translateY(calc(var(--lh) * .756))}}

.winbox{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:24px;text-align:center;
 background:radial-gradient(circle,rgba(40,12,0,.82),rgba(0,0,0,.92));opacity:0;visibility:hidden;transition:opacity .35s,visibility .35s}
.winbox.show{opacity:1;visibility:visible}
.winbox .tag{font-size:clamp(20px,2.8vw,32px);font-weight:900;letter-spacing:.25em;color:var(--gold)}
.winbox .who{max-width:100%;overflow-wrap:anywhere;font-size:clamp(42px,7.5vw,96px);font-weight:900;line-height:1.15;
 background:linear-gradient(#fffbe0,#f6c64f 50%,#c98a17);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 16px rgba(246,198,79,.6))}
.winbox .id{color:var(--muted);font-size:clamp(16px,2vw,22px)}
.winbox.show .tag{animation:pop .55s cubic-bezier(.2,1.7,.4,1) both}
.winbox.show .who{animation:pop .7s .12s cubic-bezier(.2,1.7,.4,1) both}
.winbox.show .id{animation:pop .6s .3s both}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
#close{margin-top:14px}

#status{min-height:48px;color:#ffdb8d;text-align:center}
#history{padding-left:24px;max-height:300px;overflow:auto}li{padding:7px;overflow-wrap:anywhere}

@media(max-width:860px){.grid{grid-template-columns:1fr}main{padding:14px}}
@media(max-width:560px){.lever{display:none}.machine{padding:12px 12px 18px}.sym{padding:0 34px}}
@media(prefers-reduced-motion:reduce){.bulb,#start,.machine.win .payline,.winbox.show *{animation:none!important}}
</style></head><body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="mblur" x="0" y="-20%" width="100%" height="140%"><feGaussianBlur id="mblurStd" stdDeviation="0 0"/></filter></svg>
<main>
<h1>CI 月月送 · 拉霸抽獎</h1>
<p class="muted">獨立測試版 6.0｜只抽人名 · 免安裝 · 不集中保存 · 無外部資源</p>
<p class="notice">尚未部署或經公司核准。名單及結果只存在本頁記憶體；重新整理／關閉前請匯出。不同電腦不共用紀錄。</p>
<div class="grid">
<section class="panel"><h2>活動設定</h2>
<fieldset id="setup" style="border:0;padding:0;margin:0">
<label for="names">參加者名單</label>
<textarea id="names" placeholder="工號,姓名&#10;TEST001,測試甲&#10;TEST002,測試乙"></textarea>
<small>支援一行一姓名，或 CSV「工號,姓名」；標題可用 id,name。無工號時同名視為同一人，有工號時依工號去重。每人一張籤。</small>
<label for="file">或選擇 UTF-8 CSV</label><input id="file" type="file" accept=".csv,text/csv">
<label><input id="repeat" type="checkbox"> 允許同一人重複抽出</label>
<button id="lock" type="button">確認名單並鎖定</button><button id="demo" class="secondary" type="button">載入虛構測試資料</button>
</fieldset>
<button id="reset" class="secondary" type="button">清除活動／重新設定</button>
<p id="summary" class="muted">尚未建立活動</p>
</section>

<section class="panel" id="stage">
<canvas id="fx" aria-hidden="true"></canvas>
<div class="stagehead"><div class="tools"><button id="sound" class="secondary" type="button" aria-pressed="true">音效：開</button><button id="fs" class="secondary" type="button">投影全螢幕</button></div></div>
<div class="rig">
 <div class="machine" id="machine">
  <div class="marquee"><div class="bulbs" id="bulbsTop"></div><div class="title">★ CI JACKPOT ★</div><div class="bulbs" id="bulbsBot"></div></div>
  <div class="led" aria-hidden="true"><span id="ledL">DRAW ▸ #1</span><span id="ledR">READY</span></div>
  <div class="frame"><div class="window"><div class="strip" id="strip"></div><div class="shade"></div><div class="glass"></div><div class="payline"></div></div></div>
  <div class="controls"><button id="start" type="button" disabled>SPIN · 開始抽獎</button></div>
 </div>
 <button class="lever" id="lever" type="button" aria-label="拉下拉桿開始抽獎" disabled><span class="socket"></span><span class="rod"></span><span class="knob"></span></button>
</div>
<div class="winbox" id="winbox" role="dialog" aria-label="抽出結果">
 <div class="tag">★ JACKPOT ★</div><div class="who" id="wName"></div><div class="id" id="wId"></div>
 <button id="close" type="button">繼續抽獎</button>
</div>
<p id="status" role="status" aria-live="polite">先匯入參加者名單，再確認鎖定。</p>
<div class="below">
 <button id="export" class="secondary" type="button" disabled>匯出抽出名單 CSV</button>
 <h3>抽出紀錄</h3><ol id="history"></ol>
 <small class="muted">每次抽獎會先產生並記錄結果，再播放揭曉動畫；動畫不會改變結果。此工具不是不可竄改的稽核系統。</small>
</div>
</section>
</div></main>
<script>
/* ===== Core logic (tested) ===== */
function parseCSV(s){s=s.replace(/^\uFEFF/,'');let rows=[],row=[],v='',q=false;for(let i=0;i<s.length;i++){let c=s[i];if(c==='"'){if(q&&s[i+1]==='"'){v+='"';i++;}else if(!q&&v.length)throw Error('引號格式錯誤');else q=!q;}else if(c===','&&!q){row.push(v);v='';}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&s[i+1]==='\n')i++;row.push(v);if(row.some(x=>x.trim()))rows.push(row);row=[];v='';}else v+=c;}if(q)throw Error('CSV 引號未閉合');row.push(v);if(row.some(x=>x.trim()))rows.push(row);return rows;}
function participants(text){let rows=parseCSV(text);if(!rows.length)throw Error('請提供名單');let header=rows[0].map(x=>x.trim().toLowerCase());let has=header.includes('姓名')||header.includes('name');let ni=has?Math.max(header.indexOf('姓名'),header.indexOf('name')):rows[0].length>1?1:0;let ii=has?Math.max(header.indexOf('工號'),header.indexOf('id')):rows[0].length>1?0:-1;if(has)rows.shift();let seen=new Set(),out=[],duplicates=0;for(let r of rows){let name=(r[ni]||'').trim(),id=ii>=0?(r[ii]||'').trim():'';if(!name)throw Error('存在缺少姓名的資料列');if(ii>=0&&!id)throw Error('工號欄不得留白');let key=id?'id:'+id:'name:'+name;if(seen.has(key)){duplicates++;continue;}seen.add(key);out.push({id,name,key});}if(!out.length)throw Error('沒有有效參加者');if(out.length>20000)throw Error('名單上限為 20,000 人');return {list:out,duplicates};}
function pickIndex(n){if(!Number.isSafeInteger(n)||n<1||n>20000)throw Error('候選人數不正確');let a=new Uint32Array(1),limit=4294967296-4294967296%n;do{crypto.getRandomValues(a);}while(a[0]>=limit);return a[0]%n;}
function eligibleOf(state){return state.list.filter(p=>state.repeat||!state.results.some(r=>r.key===p.key));}
function draw(state,indexer=pickIndex){if(state.busy)throw Error('抽獎進行中');let eligible=eligibleOf(state);if(!eligible.length)throw Error('所有人都已抽出');let p=eligible[indexer(eligible.length)];let result={...p,time:new Date().toISOString(),sequence:state.results.length+1};state.results.push(result);return result;}
function csvCell(v){v=String(v);if(/^[\s]*[=+@-]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"';}
function resultsCSV(results){return '\uFEFF'+[['序號','工號','姓名','時間(UTC)'],...results.map(r=>[r.sequence,r.id,r.name,r.time])].map(r=>r.map(csvCell).join(',')).join('\r\n');}
/* ===== End core ===== */

const $=id=>document.getElementById(id);
let state={list:[],results:[],repeat:false,busy:false},locked=false,reading=false,winTimer=0;
const reduced=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
function say(s){$('status').textContent=s;}

/* ===== Sound: all generated locally with Web Audio, no files ===== */
const sfx={on:true,ctx:null,bus:null,spin:null,
 c(){if(!this.on)return null;try{if(!this.ctx){const A=window.AudioContext||window.webkitAudioContext;if(!A)return null;this.ctx=new A();}if(this.ctx.state==='suspended')this.ctx.resume();return this.ctx;}catch(e){return null;}},
 out(){const c=this.ctx;if(!this.bus){const comp=c.createDynamicsCompressor();comp.threshold.value=-16;comp.knee.value=8;comp.ratio.value=5;comp.attack.value=.003;comp.release.value=.18;const m=c.createGain();m.gain.value=1.9;comp.connect(m);m.connect(c.destination);this.bus=comp;}return this.bus;},
 tone(f,d,type,vol,at,slide){const c=this.c();if(!c)return;try{const t=c.currentTime+(at||0),o=c.createOscillator(),g=c.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);g.gain.setValueAtTime(vol||.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(this.out());o.start(t);o.stop(t+d+.03);}catch(e){}},
 nbuf(d){const c=this.ctx,n=Math.max(1,Math.floor(c.sampleRate*d)),b=c.createBuffer(1,n,c.sampleRate),x=b.getChannelData(0);for(let i=0;i<n;i++)x[i]=Math.random()*2-1;return b;},
 noise(d,vol,at,freq,type,q){const c=this.c();if(!c)return;try{const t=c.currentTime+(at||0),s=c.createBufferSource();s.buffer=this.nbuf(d);const f=c.createBiquadFilter();f.type=type||'bandpass';f.frequency.value=freq||1000;if(q)f.Q.value=q;const g=c.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f);f.connect(g);g.connect(this.out());s.start(t);}catch(e){}},
 kick(at,v){this.tone(160,.24,'sine',v||.5,at,38);this.noise(.03,(v||.5)*.4,at,3000,'highpass');},
 snare(at,v){this.noise(.14,v||.22,at,1900,'bandpass',.7);this.tone(230,.08,'triangle',(v||.22)*.55,at);},
 hat(at,v){this.noise(.04,v||.08,at,8500,'highpass');},
 crash(at,v){this.noise(1.6,v||.3,at,5500,'highpass');this.noise(.9,(v||.3)*.6,at,2500,'bandpass',.4);},
 /* brass-like stab: detuned saws */
 stab(fs,at,d,v){fs.forEach(f=>{this.tone(f,d,'sawtooth',v,at);this.tone(f*1.006,d,'sawtooth',v*.8,at);this.tone(f/2,d,'square',v*.5,at);});},
 tick(){this.tone(2400,.02,'square',.08);this.tone(850,.04,'triangle',.1);this.noise(.015,.07,0,5000,'highpass');},
 lever(){this.tone(340,.25,'sawtooth',.13,0,55);this.noise(.14,.22,0,900,'bandpass');this.kick(.28,.7);this.noise(.08,.24,.3,2500,'bandpass');
  /* "here we go" riser */ this.tone(200,.55,'sawtooth',.06,.3,1200);this.noise(.5,.08,.3,3000,'highpass');},
 /* driving game-show beat while reel is at full speed */
 groove(step){const a=0;this.hat(a,.09);if(step%2===0)this.kick(a,.55);if(step%4===2)this.snare(a,.24);
  if(step%2===0){const bass=[110,110,147,131][Math.floor(step/2)%4];this.tone(bass,.12,'sawtooth',.09);}},
 roll(v){this.snare(0,v);},
 heart(){this.kick(0,.6);this.kick(.15,.4);},
 spinStart(){const c=this.c();if(!c||this.spin)return;try{
  const len=c.sampleRate*2,buf=c.createBuffer(1,len,c.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*(0.6+0.4*Math.sin(i/c.sampleRate*2*Math.PI*38));
  const src=c.createBufferSource();src.buffer=buf;src.loop=true;
  const bp=c.createBiquadFilter();bp.type='bandpass';bp.frequency.value=500;bp.Q.value=0.9;const ng=c.createGain();ng.gain.value=0;
  const hum=c.createOscillator();hum.type='sawtooth';hum.frequency.value=45;const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=300;const hg=c.createGain();hg.gain.value=0;
  const sir=c.createOscillator();sir.type='square';sir.frequency.value=330;const sl=c.createBiquadFilter();sl.type='lowpass';sl.frequency.value=2400;const sg=c.createGain();sg.gain.value=0;
  const vib=c.createOscillator();vib.frequency.value=6;const vg=c.createGain();vg.gain.value=0;vib.connect(vg);vg.connect(sir.frequency);
  src.connect(bp);bp.connect(ng);ng.connect(this.out());hum.connect(lp);lp.connect(hg);hg.connect(this.out());sir.connect(sl);sl.connect(sg);sg.connect(this.out());
  src.start();hum.start();sir.start();vib.start();this.spin={c,src,bp,ng,hum,hg,sir,sg,vib,vg};}catch(e){this.spin=null;}},
 spinSpeed(v,prog){const s=this.spin;if(!s)return;const k=Math.min(1,v/2.5),t=s.c.currentTime,ten=Math.max(0,(prog-.4)/.6);
  s.ng.gain.setTargetAtTime(.035+.22*k,t,.04);s.bp.frequency.setTargetAtTime(400+2100*k,t,.05);
  s.hg.gain.setTargetAtTime(.03+.1*k,t,.05);s.hum.frequency.setTargetAtTime(40+85*k,t,.05);
  s.sir.frequency.setTargetAtTime(300+900*ten,t,.08);s.sg.gain.setTargetAtTime(.05*ten,t,.08);s.vg.gain.setTargetAtTime(25*ten,t,.1);},
 spinStop(){const s=this.spin;if(!s)return;this.spin=null;try{const t=s.c.currentTime;
  s.ng.gain.setTargetAtTime(0,t,.04);s.hg.gain.setTargetAtTime(0,t,.04);s.sg.gain.setTargetAtTime(0,t,.02);[s.src,s.hum,s.sir,s.vib].forEach(n=>n.stop(t+.4));}catch(e){}},
 clunk(){this.kick(0,.9);this.crash(0,.22);this.tone(170,.22,'triangle',.28,0,55);this.noise(.1,.32,0,1200,'bandpass');},
 /* crowd: several noise bands with wobbling envelopes */
 crowd(at,dur,v){const c=this.c();if(!c)return;try{const t=c.currentTime+at;[[700,.8],[1300,.9],[2400,1.1]].forEach(([f,q],i)=>{const s=c.createBufferSource();s.buffer=this.nbuf(dur);const bp=c.createBiquadFilter();bp.type='bandpass';bp.frequency.value=f;bp.Q.value=q;const g=c.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v*(i===1?1:.7),t+.35);for(let k=1;k<Math.floor(dur/0.18);k++){g.gain.setValueAtTime(v*(.55+Math.random()*.5)*(1-k*0.18/dur*.6),t+.35+k*.18);}g.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(bp);bp.connect(g);g.connect(this.out());s.start(t);});
   /* a few "woo!" whistles */ for(let i=0;i<4;i++){const a=at+.2+Math.random()*1.2,f=900+Math.random()*500;this.tone(f,.45,'sine',.05,a,f*1.7);}}catch(e){}},
 applause(at,dur,n){for(let i=0;i<n;i++){const a=at+Math.random()*dur*(0.3+0.7*Math.random());this.noise(.025,.05+Math.random()*.07,a,1200+Math.random()*2500,'bandpass',1.2);}},
 win(){
  this.crash(0,.35);this.kick(0,.9);
  /* fanfare: dah-dah-dah-DAAAH */
  this.stab([523,659,784],.0,.14,.055);this.stab([523,659,784],.16,.14,.055);this.stab([523,659,784],.32,.14,.055);this.stab([698,880,1047],.48,.9,.06);
  this.kick(.48,.8);this.crash(.48,.28);
  [1047,1319,1568,2093].forEach(f=>this.tone(f,1.3,'triangle',.07,.48));
  /* party beat */ for(let i=0;i<12;i++){const a=.6+i*.2;this.kick(a,.5);this.hat(a+.1,.09);if(i%2)this.snare(a,.2);}
  /* coin shower */ for(let i=0;i<34;i++){const a=.55+i*.07,f=2400+((i*7)%5)*320;this.tone(f,.06,'square',.04,a);this.tone(f*1.5,.09,'triangle',.035,a+.03);}
  this.crowd(.35,3.2,.32);this.applause(.5,3.0,160);
  /* final hit */ this.stab([523,659,784,1047],2.95,.7,.05);this.crash(2.95,.25);this.kick(2.95,.8);
 }
};

const fx={raf:0,
 run(){if(reduced())return;const cv=$('fx'),r=cv.getBoundingClientRect();if(!r.width)return;const dpr=Math.min(2,window.devicePixelRatio||1);cv.width=r.width*dpr;cv.height=r.height*dpr;const x=cv.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);
  const cols=['#f6c64f','#ff4d6d','#69e4d1','#ffffff','#8ec5ff','#ffa94d'],ps=[];
  for(let i=0;i<170;i++){const coin=i%4===0;ps.push({x:r.width*(.5+(Math.random()-.5)*.35),y:r.height*.42,vx:(Math.random()-.5)*11,vy:-Math.random()*12-5,rot:Math.random()*6,vr:(Math.random()-.5)*.35,s:coin?8+Math.random()*5:6+Math.random()*7,coin,c:cols[i%cols.length]});}
  const t0=performance.now(),DUR=4300;cancelAnimationFrame(this.raf);
  const step=now=>{const el=now-t0;x.clearRect(0,0,r.width,r.height);x.globalAlpha=Math.max(0,1-Math.max(0,el-2800)/1500);
   for(const p of ps){p.vy+=.3;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;x.save();x.translate(p.x,p.y);
    if(p.coin){x.scale(Math.max(.15,Math.abs(Math.cos(p.rot))),1);x.fillStyle='#f6c64f';x.beginPath();x.arc(0,0,p.s,0,6.2832);x.fill();x.lineWidth=2;x.strokeStyle='#a86f12';x.stroke();}
    else{x.rotate(p.rot);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);}x.restore();}
   if(el<DUR)this.raf=requestAnimationFrame(step);else x.clearRect(0,0,r.width,r.height);};
  this.raf=requestAnimationFrame(step);},
 stop(){cancelAnimationFrame(this.raf);const cv=$('fx');cv.getContext('2d').clearRect(0,0,cv.width,cv.height);}
};

const DECO='★ ★ ★';
let tri=[DECO,'READY',DECO];
function setStrip(items){$('strip').replaceChildren(...items.map(t=>{const d=document.createElement('div');d.className='sym'+(t===DECO?' deco':'');const s=document.createElement('span');s.textContent=t;d.append(s);return d;}));}
function symH(){const s=$('strip').firstElementChild;return s?s.offsetHeight:100;}
function idle(){setStrip(tri);$('strip').style.transform='translateY(0px)';$('strip').style.filter='none';}
function blur(v){const b=Math.min(9,v*3.2);$('mblurStd').setAttribute('stdDeviation','0 '+b.toFixed(1));$('strip').style.filter=b>.4?'url(#mblur)':'none';}

function spin(result,onStop){
 const names=state.list.map(p=>p.name),rnd=()=>names[pickIndex(names.length)],red=reduced();
 const other=x=>{for(let i=0;i<12;i++){const n=rnd();if(n!==x)return n;}return rnd();};
 const N=red?3:Math.min(72,40+Math.floor(names.length/8));
 const A=[rnd(),other(result.name),result.name,other(result.name)];for(let i=1;i<N;i++)A.push(rnd());A.push(tri[0],tri[1],tri[2],rnd());
 setStrip(A);const h=symH(),ci=A.length-3,ti=2,ys=-(ci-1)*h,ye=-(ti-1)*h,strip=$('strip');
 const W=red?0:320,M=red?450:5200,B=red?0:560,WU=red?0:.32*h,OV=red?0:.34*h,y1=ys-WU;
 const a=.07,b=.33,T=a/2+(b-a)+(1-b)/3;
 const ease=u=>{let s;if(u<=a)s=u*u/(2*a);else if(u<=b)s=a/2+(u-a);else s=a/2+(b-a)+(1-b)/3*(1-Math.pow((1-u)/(1-b),3));return s/T;};
 let t0=null,prevY=ys,prevT=0,lastK=0,lastTick=0,phase=0,lastBeat=0,lastGroove=0,gStep=0,lastRoll=0;
 sfx.spinStart();
 strip.style.transform='translateY('+ys+'px)';
 const frame=now=>{if(t0===null){t0=now;prevT=now;}const t=now-t0;let y;
  if(t<W){y=ys-WU*Math.sin(Math.PI/2*t/W);}
  else if(t<W+M){y=y1+(ye+OV-y1)*ease((t-W)/M);}
  else if(t<W+M+B){if(phase<2){phase=2;sfx.spinStop();sfx.clunk();$('machine').classList.add('thud');}const tb=(t-W-M)/1000;y=ye+OV*Math.exp(-7*tb)*Math.cos(tb*Math.PI*4.2);}
  else{y=ye;}
  strip.style.transform='translateY('+y.toFixed(2)+'px)';
  const dt=Math.max(1,now-prevT),spd=Math.abs(y-prevY)/dt;blur(red?0:spd);prevY=y;prevT=now;
  if(phase<2&&!red){const pr=t<W?0:Math.min(1,(t-W)/M);sfx.spinSpeed(spd,pr);
   /* stage 1: driving beat at full speed */
   if(pr>.02&&pr<.42&&now-lastGroove>=125){sfx.groove(gStep++);lastGroove=now;}
   /* stage 2: snare roll that speeds up and gets louder */
   if(pr>=.42){const q=(pr-.42)/.58,gap=150-110*q;if(now-lastRoll>gap){sfx.roll(.08+.22*q);lastRoll=now;}}
   /* stage 3: heartbeat right before the stop */
   if(pr>.7){const gap=480-230*(pr-.7)/.3;if(now-lastBeat>gap){sfx.heart();lastBeat=now;}}
  }
  const k=Math.floor((y-ys)/h);if(k!==lastK&&now-lastTick>28){sfx.tick();lastTick=now;}lastK=k;
  if(t<W+M+B)requestAnimationFrame(frame);
  else{blur(0);sfx.spinStop();if(red)sfx.clunk();tri=[A[ti-1],A[ti],A[ti+1]];idle();$('machine').classList.remove('thud');onStop();}
 };
 requestAnimationFrame(frame);
}

function bulbs(){['bulbsTop','bulbsBot'].forEach((id,j)=>{const box=$(id);for(let i=0;i<16;i++){const s=document.createElement('span');s.className='bulb';s.style.animationDelay=(-(i+j*8)%16*.1)+'s';box.append(s);}});}
function left(){return locked?eligibleOf(state).length:0;}
function led(){const n=state.results.length+(state.busy?0:1);$('ledL').textContent='DRAW ▸ #'+n;$('ledR').textContent=state.busy?'SPINNING':(locked?'LEFT '+left():'READY');}
function render(){
 const can=locked&&!state.busy&&left()>0;
 $('start').disabled=!can;$('lever').disabled=!can;
 $('export').disabled=!state.results.length||state.busy;$('reset').disabled=state.busy;
 $('summary').textContent=locked?'參加者 '+state.list.length+' 人｜已抽出 '+(state.busy?state.results.length-1:state.results.length)+' 次｜'+(state.repeat?'允許重複':'不重複抽出'):'尚未建立活動';
 const shown=state.busy?state.results.slice(0,-1):state.results;
 $('history').replaceChildren(...shown.map(r=>{const li=document.createElement('li');li.textContent=r.name+(r.id?'（'+r.id+'）':'');return li;}));
 led();
}
function hideWin(){clearTimeout(winTimer);$('winbox').classList.remove('show');$('machine').classList.remove('win');fx.stop();}
function go(){
 if(state.busy||!locked)return;
 try{
  hideWin();
  const result=draw(state);state.busy=true;render();
  $('machine').classList.add('spinning');say('抽獎中…請勿關閉或重新整理。');
  const lv=$('lever');lv.classList.remove('pull');void lv.offsetWidth;lv.classList.add('pull');sfx.lever();
  setTimeout(()=>spin(result,()=>{
   $('machine').classList.remove('spinning');$('machine').classList.add('win');
   winTimer=setTimeout(()=>{
    $('wName').textContent=result.name;$('wId').textContent=result.id?'工號 '+result.id:'';
    $('winbox').classList.add('show');sfx.win();fx.run();
    state.busy=false;render();
    say('恭喜 '+result.name+'！'+(left()<1?'所有參加者都已抽出。':'')+'請記得匯出紀錄。');$('close').focus();
   },reduced()?0:700);
  }),reduced()?0:260);
 }catch(e){say(e.message);}
}

/* ===== Fullscreen with in-page fallback (e.g. inside OneDrive/Teams preview frames) ===== */
function pfsOn(){return $('stage').classList.contains('pfs');}
function setPfs(on){$('stage').classList.toggle('pfs',on);document.body.classList.toggle('pfs-on',on);fsLabel();if(!state.busy)idle();}
function fsLabel(){$('fs').textContent=(document.fullscreenElement||pfsOn())?'離開全螢幕':'投影全螢幕';}
$('fs').addEventListener('click',()=>{
 if(document.fullscreenElement){document.exitFullscreen().catch(()=>{});return;}
 if(pfsOn()){setPfs(false);return;}
 const s=$('stage'),allowed=document.fullscreenEnabled&&s.requestFullscreen;
 if(allowed){s.requestFullscreen().catch(()=>{setPfs(true);say('瀏覽器不允許真正全螢幕，已改用網頁全螢幕；可再按 F11 讓瀏覽器也全螢幕。');});}
 else{setPfs(true);say('已改用網頁全螢幕；可再按 F11 讓瀏覽器也全螢幕。');}
});
document.addEventListener('fullscreenchange',()=>{fsLabel();if(!state.busy)idle();});

$('start').addEventListener('click',go);
$('lever').addEventListener('click',go);
$('lever').addEventListener('animationend',e=>{if(e.animationName==='knob')$('lever').classList.remove('pull');});
$('close').addEventListener('click',()=>{hideWin();if(!$('start').disabled)$('start').focus();});
document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;if($('winbox').classList.contains('show')){hideWin();if(!$('start').disabled)$('start').focus();}else if(pfsOn())setPfs(false);});
$('sound').addEventListener('click',()=>{sfx.on=!sfx.on;if(!sfx.on)sfx.spinStop();$('sound').textContent=sfx.on?'音效：開':'音效：關';$('sound').setAttribute('aria-pressed',String(sfx.on));});
$('file').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;if(f.size>5*1024*1024){say('檔案超過 5 MB');return;}reading=true;$('lock').disabled=true;try{$('names').value=await f.text();say('已讀取檔案，請確認鎖定。');}catch(err){say('檔案讀取失敗');}finally{reading=false;$('lock').disabled=false;}});
$('demo').addEventListener('click',()=>{$('names').value='工號,姓名\nTEST001,測試甲\nTEST002,測試乙\nTEST003,測試丙\nTEST004,測試丁\nTEST005,測試戊\nTEST006,測試己\nTEST007,測試庚\nTEST008,測試辛';say('已載入虛構測試資料，並非真實員工資料。');});
$('lock').addEventListener('click',()=>{if(reading)return;try{
 if(!globalThis.crypto?.getRandomValues)throw Error('瀏覽器不支援所需亂數功能');
 const parsed=participants($('names').value);
 state={list:parsed.list,results:[],repeat:$('repeat').checked,busy:false};locked=true;$('setup').disabled=true;
 tri=[DECO,'READY',DECO];idle();render();say('名單已鎖定，共 '+parsed.list.length+' 人。忽略重複名單 '+parsed.duplicates+' 筆。按下 SPIN 或拉下拉桿開始！');
}catch(e){say(e.message);}});
$('export').addEventListener('click',()=>{if(state.busy||!state.results.length)return;const url=URL.createObjectURL(new Blob([resultsCSV(state.results)],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='CI_Draw_Results_'+new Date().toISOString().slice(0,10)+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);say('已要求瀏覽器匯出，請確認下載檔案。');});
$('reset').addEventListener('click',()=>{if(state.busy)return;if(!confirm('清除所有名單與結果？請先匯出。'))return;
 hideWin();state={list:[],results:[],repeat:false,busy:false};locked=false;$('setup').disabled=false;
 $('names').value='';$('file').value='';$('repeat').checked=false;tri=[DECO,'READY',DECO];idle();render();say('活動已清除。');});
window.addEventListener('beforeunload',e=>{if(locked){e.preventDefault();e.returnValue='';}});
bulbs();idle();render();
</script></body></html>
